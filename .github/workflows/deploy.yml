name: CI/CD Pipeline

on:
  push:
    branches:
      - work/final-work_9

jobs:
  ci:
    name: Run Tests and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run linter (flake8)
        run: |
          flake8 . --exclude=env,migrations,__pycache__

      - name: 🧪 Запустить тесты
        env:
          SECRET_KEY: dummykey
          DEBUG: "False"
          DB_NAME: test_habitflow
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          TELEGRAM_BOT_TOKEN: test_token
          CELERY_BROKER_URL: redis://localhost:6379/0
        services:
          postgres:
            image: postgres:15
            env:
              POSTGRES_DB: habitflow_db
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
            ports:
              - 5432:5432
            options: >-
              --health-cmd=pg_isready
              --health-interval=10s
              --health-timeout=5s
              --health-retries=5
          redis:
            image: redis:7
            ports:
              - 6379:6379
        run: |
          python manage.py test --settings=config.settings

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            --target backend \
            -t myapp-backend:latest .

      - name: Build celery image
        run: |
          docker build \
            --target celery \
            -t myapp-celery:latest .

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [ci, build]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy SSH Key
        uses: webfactory/ssh-agent@v0.5.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Перейти в папку проекта
            cd /home/${{ secrets.SSH_USERNAME }}/habitflow || exit

            # Сохранить .env (можно генерировать из секретов)
            cat > .env << EOF
            DEBUG=${{ secrets.DEBUG }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            DB_HOST=db
            DB_NAME=habitflow
            DB_USER=postgres
            REDIS_URL=redis://redis:6379/0
            EOF

            # Скачать обновлённый docker-compose.yml
            curl -o docker-compose.yml https://raw.githubusercontent.com/ваш-юзер/ваш-репо/main/docker-compose.yml

            # Остановить старые контейнеры
            docker-compose down

            # Собрать новые образы (или использовать pre-built)
            docker-compose build --no-cache

            # Запустить в фоне
            docker-compose up -d

            # Применить миграции
            docker-compose run backend python manage.py migrate --noinput

            # Собрать статику (если не в Dockerfile)
            docker-compose run backend python manage.py collectstatic --noinput

            echo "✅ Деплой завершён!"
